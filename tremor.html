<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14181C">
<title>손떨림 체험 · 수전증 체험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
  html,body{ overflow-y:auto; }
  #app{ min-height:100%; display:flex; flex-direction:column; padding-top:var(--safe-top); padding-bottom:calc(20px + var(--safe-bottom)); }
  #topbar{ display:flex; align-items:center; gap:10px; padding:14px 16px 6px; }
  #homeBtn{ width:34px; height:34px; border-radius:50%; background:var(--bg-panel); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }
  #topbar h1{ font-size:17px; margin:0; flex:1; }

  #modeTabs{ display:flex; gap:8px; padding:6px 16px 14px; }
  .modetab{ flex:1; padding:10px 4px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg-panel); color:var(--ink-dim); font-weight:700; font-size:12px; text-align:center; }
  .modetab.on{ border-color:var(--brick); background:rgba(176,87,74,.14); color:#E2A79E; }

  .wrap{ padding:0 16px; }
  .card{ background:var(--bg-panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
  .eyebrow{ font-size:10.5px; color:var(--amber); font-weight:700; letter-spacing:.06em; margin-bottom:4px; }
  .card h2{ font-size:15.5px; margin:0 0 4px; }
  .card p.sub{ font-size:12.5px; color:var(--ink-dim); margin:0 0 10px; line-height:1.5; }

  .lvrow{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px; }
  .lvbtn{ padding:10px 4px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg-panel-2); color:var(--ink-dim); text-align:center; font-size:12.5px; font-weight:700; }
  .lvbtn.on{ border-color:var(--brick); background:rgba(176,87,74,.16); color:#E2A79E; }

  canvas{ width:100%; aspect-ratio:1/1; background:#0F1216; border-radius:14px; border:1px solid var(--line); touch-action:none; display:block; }
  .statsRow{ display:flex; justify-content:space-between; margin-top:10px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim); }
  .statsRow b{ color:var(--amber); }
  .ghostBtn{ background:var(--bg-panel-2); color:var(--ink-dim); border:1px solid var(--line); font-weight:700; font-size:13px; padding:10px 18px; border-radius:22px; width:100%; margin-top:10px; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <a id="homeBtn" href="index.html">&#8592;</a>
    <h1>손떨림 체험</h1>
  </div>

  <div id="modeTabs">
    <button class="modetab on" data-mode="task">&#127865; 생활과제</button>
    <button class="modetab" data-mode="maze">&#129517; 미로 통과</button>
    <button class="modetab" data-mode="trace">&#9998; 따라쓰기</button>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="eyebrow" id="modeEyebrow">생활과제 체험 &middot; 컵 옮기기</div>
      <h2 id="modeTitle">떨리는 손으로 컵을 받침 위에 올려보세요</h2>
      <p class="sub" id="modeSub">원(컵)을 눌러서 목표 지점의 점선 원 안까지 옮겨보세요. 손떨림 정도에 따라 실제 손가락 위치와 컵 위치가 달라집니다.</p>

      <div class="lvrow">
        <div class="lvbtn on" data-lv="0">&#9679; 정상</div>
        <div class="lvbtn" data-lv="1">&#9679;&#9679; 경증</div>
        <div class="lvbtn" data-lv="2">&#9679;&#9679;&#9679; 중증</div>
      </div>

      <canvas id="cv" width="600" height="600"></canvas>
      <div class="statsRow"><span>시도 <b id="statTries">0</b>회</span><span>성공 <b id="statOK">0</b>회</span><span id="statExtra">평균 이탈 <b>0px</b></span></div>
      <button class="ghostBtn" id="btnReset">다시 시작</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const modeEyebrow = document.getElementById('modeEyebrow');
const modeTitle = document.getElementById('modeTitle');
const modeSub = document.getElementById('modeSub');
const statTries = document.getElementById('statTries');
const statOK = document.getElementById('statOK');
const statExtra = document.getElementById('statExtra');

let mode = 'task';
let level = 0; // 0 normal, 1 mild, 2 severe
const AMP = [0, 9, 22];       // px jitter amplitude
const FREQ = [0, 5.6, 7.8];   // Hz-ish

let tries=0, ok=0, deviations=[];

const MODES = {
  task: {
    eyebrow:'생활과제 체험 · 컵 옮기기',
    title:'떨리는 손으로 컵을 받침 위에 올려보세요',
    sub:'원(컵)을 눌러서 목표 지점의 점선 원 안까지 옮겨보세요. 손떨림 정도에 따라 실제 손가락 위치와 컵 위치가 달라집니다.'
  },
  maze: {
    eyebrow:'미로 통과 체험 · 손끝으로 길 따라가기',
    title:'떨리는 손으로 미로 길을 벗어나지 않게 통과해보세요',
    sub:'점을 눌러서 시작점부터 도착점까지 회색 길을 따라 옮겨보세요. 벽에 닿은 횟수가 기록됩니다.'
  },
  trace: {
    eyebrow:'따라쓰기 체험 · 곡선 따라 그리기',
    title:'점선 곡선을 최대한 벗어나지 않게 따라 그어보세요',
    sub:'선을 따라 손가락을 움직이면 실제 궤적이 어떻게 흔들리는지, 평균 이탈 거리로 점수를 알려드려요.'
  }
};

document.querySelectorAll('.modetab').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.modetab').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    mode = b.dataset.mode;
    resetStats();
    applyModeText();
    initScene();
  });
});
document.querySelectorAll('.lvbtn').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.lvbtn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    level = +b.dataset.lv;
    resetStats();
    initScene();
  });
});
document.getElementById('btnReset').addEventListener('click', ()=>{ resetStats(); initScene(); });

function applyModeText(){
  const m = MODES[mode];
  modeEyebrow.textContent = m.eyebrow;
  modeTitle.textContent = m.title;
  modeSub.textContent = m.sub;
  statExtra.style.display = mode==='trace' ? 'inline' : (mode==='maze' ? 'inline' : 'none');
  statExtra.innerHTML = mode==='maze' ? '벽 접촉 <b id="statHit">0</b>회' : '평균 이탈 <b id="statDev">0px</b>';
}

// ---------- shared tremor ----------
let t0 = performance.now();
function jitter(amp){
  const t = (performance.now()-t0)/1000;
  const f = FREQ[level];
  const jx = Math.sin(t*f*2*Math.PI + 1.3)*amp + (Math.random()-0.5)*amp*0.5;
  const jy = Math.cos(t*f*2*Math.PI*0.87)*amp + (Math.random()-0.5)*amp*0.5;
  return {jx,jy};
}

function resetStats(){
  tries=0; ok=0; deviations=[]; 
  statTries.textContent='0'; statOK.textContent='0';
}

// ---------- pointer tracking ----------
let pointerActive=false, px=0, py=0;
function toCanvasXY(e){
  const rect = cv.getBoundingClientRect();
  const clientX = e.touches? e.touches[0].clientX : e.clientX;
  const clientY = e.touches? e.touches[0].clientY : e.clientY;
  return { x:(clientX-rect.left)/rect.width*cv.width, y:(clientY-rect.top)/rect.height*cv.height };
}
cv.addEventListener('pointerdown', e=>{ pointerActive=true; const p=toCanvasXY(e); px=p.x; py=p.y; });
window.addEventListener('pointermove', e=>{ if(!pointerActive) return; const p=toCanvasXY(e); px=p.x; py=p.y; });
window.addEventListener('pointerup', ()=>{ pointerActive=false; onRelease(); });

// ================= TASK MODE (컵 옮기기) =================
let cup, target;
function taskInit(){
  cup = {x:120, y:480};
  target = {x:480, y:150, r:46};
}
function taskDraw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  // target
  ctx.setLineDash([8,8]);
  ctx.strokeStyle='#7A9471'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(target.x,target.y,target.r,0,7); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(122,148,113,.12)';
  ctx.beginPath(); ctx.arc(target.x,target.y,target.r,0,7); ctx.fill();

  let cx=cup.x, cy=cup.y;
  if(pointerActive){
    const {jx,jy} = jitter(AMP[level]);
    cx = px+jx; cy = py+jy;
    cup.x=cx; cup.y=cy;
  }
  ctx.fillStyle='#D9A441';
  ctx.beginPath(); ctx.arc(cx,cy,30,0,7); ctx.fill();
  ctx.fillStyle='#1B1300'; ctx.font='bold 22px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('☕', cx, cy);
}
function taskRelease(){
  const dx = cup.x-target.x, dy=cup.y-target.y;
  const dist = Math.hypot(dx,dy);
  tries++; if(dist<target.r) ok++;
  statTries.textContent=tries; statOK.textContent=ok;
  cup = {x:120,y:480};
}

// ================= MAZE MODE =================
let mazeWalls, mazePos, mazeGoal, hitCount=0;
function mazeInit(){
  mazeWalls = [
    {x:0,y:0,w:600,h:70},{x:0,y:530,w:600,h:70},
    {x:0,y:0,w:70,h:600},{x:530,y:0,w:70,h:600},
    {x:150,y:150,w:340,h:60},
    {x:150,y:390,w:340,h:60},
    {x:150,y:270,w:60,h:120},
  ];
  mazePos = {x:110,y:110};
  mazeGoal = {x:490,y:490,r:36};
  hitCount=0;
  const el = document.getElementById('statHit'); if(el) el.textContent='0';
}
function pointInRect(x,y,r){ return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h; }
function mazeDraw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#242B32';
  mazeWalls.forEach(w=> ctx.fillRect(w.x,w.y,w.w,w.h));
  ctx.setLineDash([8,8]); ctx.strokeStyle='#7A9471'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(mazeGoal.x,mazeGoal.y,mazeGoal.r,0,7); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#8FAEDB'; ctx.beginPath(); ctx.arc(110,110,14,0,7); ctx.fill();

  let cx=mazePos.x, cy=mazePos.y;
  if(pointerActive){
    const {jx,jy} = jitter(AMP[level]);
    cx = px+jx; cy=py+jy;
    let hitWall=false;
    mazeWalls.forEach(w=>{ if(pointInRect(cx,cy,w)) hitWall=true; });
    if(hitWall){ hitCount++; const el=document.getElementById('statHit'); if(el) el.textContent=hitCount; }
    else { mazePos.x=cx; mazePos.y=cy; }
  }
  ctx.fillStyle='#D9A441'; ctx.beginPath(); ctx.arc(mazePos.x,mazePos.y,16,0,7); ctx.fill();

  if(Math.hypot(mazePos.x-mazeGoal.x, mazePos.y-mazeGoal.y) < mazeGoal.r){
    tries++; ok++; statTries.textContent=tries; statOK.textContent=ok;
    mazePos = {x:110,y:110};
  }
}
function mazeRelease(){}

// ================= TRACE MODE =================
let tracePoints, traceDrawn;
function traceInit(){
  tracePoints = [];
  for(let i=0;i<=40;i++){
    const x = 70 + i*(460/40);
    const y = 300 + Math.sin(i/40*Math.PI*2.4)*140;
    tracePoints.push({x,y});
  }
  traceDrawn = [];
}
function nearestDevOnPath(x,y){
  let min=Infinity;
  tracePoints.forEach(p=>{ const d=Math.hypot(p.x-x,p.y-y); if(d<min) min=d; });
  return min;
}
function traceDraw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setLineDash([6,8]); ctx.strokeStyle='#5B646D'; ctx.lineWidth=3;
  ctx.beginPath(); tracePoints.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); ctx.stroke();
  ctx.setLineDash([]);

  if(pointerActive){
    const {jx,jy} = jitter(AMP[level]);
    const cx=px+jx, cy=py+jy;
    traceDrawn.push({x:cx,y:cy});
    deviations.push(nearestDevOnPath(cx,cy));
  }
  ctx.strokeStyle='#D9A441'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  traceDrawn.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.stroke();

  const avg = deviations.length? (deviations.reduce((a,b)=>a+b,0)/deviations.length) : 0;
  const el = document.getElementById('statDev'); if(el) el.textContent = avg.toFixed(0)+'px';
}
function traceRelease(){
  if(traceDrawn.length>5){ tries++; statTries.textContent=tries; }
  traceDrawn=[];
}

// ---------- dispatcher ----------
function initScene(){
  if(mode==='task') taskInit();
  else if(mode==='maze') mazeInit();
  else traceInit();
}
function onRelease(){
  if(mode==='task') taskRelease();
  else if(mode==='maze') mazeRelease();
  else traceRelease();
}
function loop(){
  requestAnimationFrame(loop);
  if(mode==='task') taskDraw();
  else if(mode==='maze') mazeDraw();
  else traceDraw();
}
applyModeText();
initScene();
loop();
})();
</script>
</body>
</html>
